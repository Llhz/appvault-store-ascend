<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Review Submission')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
<div class="container py-4" style="max-width: 800px;">
    <a th:href="@{/admin/submissions}" class="text-decoration-none mb-3 d-inline-block">
        <i class="fa-solid fa-arrow-left me-1"></i>Back to Queue
    </a>

    <div class="bg-white rounded-3 shadow-sm p-4 mb-4">
        <!-- App Preview Header -->
        <div class="d-flex align-items-center gap-3 mb-4">
            <img th:src="${submission.iconUrl != null ? submission.iconUrl : 'https://placehold.co/80x80/007AFF/white?text=' + (submission.name != null and submission.name.length() > 0 ? submission.name.substring(0,1) : '?')}"
                 th:alt="${submission.name}" width="80" height="80" class="rounded-3"/>
            <div>
                <h2 class="fw-bold mb-1" th:text="${submission.name}">App Name</h2>
                <p class="text-secondary mb-1" th:text="${submission.subtitle}" th:if="${submission.subtitle}">Subtitle</p>
                <span th:if="${submission.status.name() == 'PENDING_REVIEW'}" class="badge bg-warning text-dark">Pending Review</span>
                <span th:if="${submission.status.name() == 'APPROVED'}" class="badge bg-success">Approved</span>
                <span th:if="${submission.status.name() == 'REJECTED'}" class="badge bg-danger">Rejected</span>
                <span th:if="${submission.status.name() == 'DRAFT'}" class="badge bg-secondary">Draft</span>
            </div>
        </div>

        <!-- Submission Meta -->
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-md-3">
                <div class="text-secondary small">Developer</div>
                <div class="fw-semibold" th:text="${submission.developer != null ? submission.developer : '-'}">Developer</div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="text-secondary small">Submitter</div>
                <div class="fw-semibold" th:text="${submission.submitter.fullName}">Submitter</div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="text-secondary small">Category</div>
                <div class="fw-semibold" th:text="${submission.category != null ? submission.category.name : '-'}">Category</div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="text-secondary small">Price</div>
                <div class="fw-semibold" th:text="${submission.price.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 'Free' : '$' + #numbers.formatDecimal(submission.price, 1, 2)}">Free</div>
            </div>
        </div>

        <hr/>

        <h5 class="fw-semibold mb-2">Description</h5>
        <p class="text-secondary" style="white-space: pre-line;" th:text="${submission.description}">Description</p>

        <div class="text-secondary small mt-3">
            <i class="fa-solid fa-clock me-1"></i>
            Submitted: <span th:text="${#temporals.format(submission.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
        </div>
    </div>

    <!-- Approve / Reject Actions (only for PENDING_REVIEW) -->
    <div th:if="${submission.status.name() == 'PENDING_REVIEW'}" class="row g-3">
        <div class="col-md-6">
            <div class="bg-white rounded-3 shadow-sm p-4">
                <h5 class="fw-semibold text-success mb-3">
                    <i class="fa-solid fa-check-circle me-1"></i>Approve
                </h5>
                <form th:action="@{/admin/submissions/{id}/approve(id=${submission.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Notes (optional)</label>
                        <textarea class="form-control rounded-3" name="reviewNotes" rows="3"
                                  placeholder="Add notes for the developer..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success rounded-pill px-4"
                            onclick="return confirm('Approve this submission? This will create a new app listing.')">
                        <i class="fa-solid fa-check me-1"></i>Approve Submission
                    </button>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="bg-white rounded-3 shadow-sm p-4">
                <h5 class="fw-semibold text-danger mb-3">
                    <i class="fa-solid fa-times-circle me-1"></i>Reject
                </h5>
                <form th:action="@{/admin/submissions/{id}/reject(id=${submission.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Reason for rejection</label>
                        <textarea class="form-control rounded-3" name="reviewNotes" rows="3"
                                  placeholder="Explain why this submission is being rejected..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-danger rounded-pill px-4"
                            onclick="return confirm('Reject this submission?')">
                        <i class="fa-solid fa-times me-1"></i>Reject Submission
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Existing review notes (for already reviewed submissions) -->
    <div th:if="${submission.reviewNotes != null and submission.status.name() != 'PENDING_REVIEW'}" class="bg-white rounded-3 shadow-sm p-4">
        <h5 class="fw-semibold mb-2">
            <i class="fa-solid fa-comment-dots me-1"></i>Review Notes
        </h5>
        <div class="alert rounded-3"
             th:classappend="${submission.status.name() == 'REJECTED' ? 'alert-danger' : 'alert-success'}"
             th:text="${submission.reviewNotes}">
            Notes
        </div>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
