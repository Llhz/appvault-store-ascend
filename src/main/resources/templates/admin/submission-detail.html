<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Review Submission')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
    <div class="container py-4" style="max-width: 1000px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <p class="text-secondary mb-1">Review submission</p>
                <h1 class="page-title mb-0" th:text="${submission.name}">App Name</h1>
            </div>
            <a th:href="@{/admin/submissions}" class="btn btn-outline-secondary rounded-pill">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Queue
            </a>
        </div>

        <div class="bg-white rounded-3 shadow-sm p-4 mb-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center gap-3">
                    <img th:if="${submission.iconUrl != null}" th:src="${submission.iconUrl}" alt="" width="80" height="80" class="rounded-3 object-fit-cover"/>
                    <div>
                        <div class="fw-semibold" th:text="${submission.name}">Name</div>
                        <div class="text-secondary" th:text="${submission.subtitle}">Subtitle</div>
                        <div class="text-secondary small">By <span th:text="${submission.developer != null ? submission.developer : submission.submitter.fullName}">Developer</span></div>
                    </div>
                </div>
                <span class="badge px-3 py-2"
                      th:classappend="${submission.status.name() == 'APPROVED'} ? ' bg-success' :
                                      (submission.status.name() == 'PENDING_REVIEW' ? ' bg-warning text-dark' :
                                      (submission.status.name() == 'REJECTED' ? ' bg-danger' : ' bg-secondary'))}"
                      th:text="${#strings.capitalize(submission.status.name().toLowerCase().replace('_', ' '))}">
                </span>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="text-secondary small">Category</div>
                    <div class="fw-semibold" th:text="${submission.category != null ? submission.category.name : 'Uncategorized'}">Category</div>
                </div>
                <div class="col-md-4">
                    <div class="text-secondary small">Price</div>
                    <div class="fw-semibold" th:text="${submission.price != null and submission.price.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 'Free' : '$' + #numbers.formatDecimal(submission.price, 1, 2)}">Free</div>
                </div>
                <div class="col-md-4">
                    <div class="text-secondary small">Submitted</div>
                    <div class="fw-semibold" th:text="${#temporals.format(submission.createdAt, 'MMM d, yyyy HH:mm')}">Date</div>
                </div>
            </div>

            <div class="mb-3">
                <div class="text-secondary small">Description</div>
                <p class="mb-0" th:text="${submission.description}">Description</p>
            </div>

            <div th:if="${submission.reviewNotes != null}" class="alert"
                 th:classappend="${submission.status.name() == 'REJECTED'} ? ' alert-danger' : ' alert-success'">
                <div class="fw-semibold mb-1">Previous Notes</div>
                <div th:text="${submission.reviewNotes}">Notes</div>
            </div>

            <div th:if="${submission.status.name() == 'APPROVED' and submission.appListing != null}">
                <a class="btn btn-outline-success rounded-pill" th:href="@{/app/{id}(id=${submission.appListing.id})}">
                    <i class="fa-solid fa-arrow-up-right-from-square me-2"></i>View Published Listing
                </a>
            </div>
        </div>

        <div class="bg-white rounded-3 shadow-sm p-4">
            <h5 class="fw-semibold mb-3">Moderation</h5>
            <div th:if="${submission.status.name() != 'PENDING_REVIEW'}" class="alert alert-info mb-0">
                This submission has already been <span class="fw-semibold" th:text="${submission.status.name().toLowerCase().replace('_',' ')}">processed</span>.
            </div>
            <form th:if="${submission.status.name() == 'PENDING_REVIEW'}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Review Notes</label>
                    <textarea class="form-control rounded-3" name="reviewNotes" rows="4" placeholder="Share feedback for the developer"></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success rounded-pill"
                            th:formaction="@{/admin/submissions/{id}/approve(id=${submission.id})}">
                        <i class="fa-solid fa-circle-check me-2"></i>Approve &amp; Publish
                    </button>
                    <button type="submit" class="btn btn-outline-danger rounded-pill"
                            th:formaction="@{/admin/submissions/{id}/reject(id=${submission.id})}">
                        <i class="fa-solid fa-circle-xmark me-2"></i>Reject
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
