<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('App Submission Queue')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
<div class="container py-4">
    <div class="mb-4">
        <a th:href="@{/admin/dashboard}" class="text-decoration-none text-secondary">
            <i class="fa-solid fa-arrow-left me-2"></i>Back to Admin Dashboard
        </a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">App Submission Queue</h2>
        <span class="badge bg-warning rounded-pill px-3 py-2 fs-6" th:text="${submissions.size()} + ' Pending'">0 Pending</span>
    </div>

    <!-- Pending Submissions Table -->
    <div class="bg-white rounded-3 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="border-0 ps-4">App</th>
                        <th class="border-0">Developer</th>
                        <th class="border-0">Category</th>
                        <th class="border-0">Price</th>
                        <th class="border-0">Submitted</th>
                        <th class="border-0 text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="submission : ${submissions}">
                        <td class="ps-4">
                            <div class="d-flex align-items-center gap-3">
                                <img th:src="${submission.iconUrl}" th:alt="${submission.name}"
                                     class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;"/>
                                <div>
                                    <div class="fw-semibold" th:text="${submission.name}">App Name</div>
                                    <small class="text-secondary" th:text="${submission.subtitle}">Subtitle</small>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div th:text="${submission.developer}">Developer</div>
                            <small class="text-secondary" th:text="${submission.submitter.email}">email@example.com</small>
                        </td>
                        <td>
                            <span th:if="${submission.category != null}" th:text="${submission.category.name}">Category</span>
                            <span th:unless="${submission.category != null}" class="text-secondary">— None —</span>
                        </td>
                        <td>
                            <span th:if="${submission.price == 0}" class="text-success fw-semibold">Free</span>
                            <span th:unless="${submission.price == 0}" th:text="'$' + ${submission.price}">$0.99</span>
                        </td>
                        <td>
                            <span th:text="${#temporals.format(submission.updatedAt, 'MMM dd, yyyy')}">Jan 1, 2024</span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/admin/submissions/{id}(id=${submission.id})}"
                               class="btn btn-sm btn-primary rounded-pill">
                                Review
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${submissions.isEmpty()}">
                        <td colspan="6" class="text-center py-5 text-secondary">
                            <i class="fa-solid fa-inbox fa-3x mb-3 d-block"></i>
                            <p class="mb-0">No pending submissions at this time.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
