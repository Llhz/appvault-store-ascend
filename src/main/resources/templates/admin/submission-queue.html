<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Submission Queue')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <p class="text-secondary mb-1">Review developer submissions</p>
                <h1 class="page-title mb-0"><i class="fa-solid fa-inbox me-2 text-primary"></i>Submission Queue</h1>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary rounded-pill">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>

        <div class="bg-white rounded-3 shadow-sm p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-semibold mb-0">Pending Review</h5>
                <span class="badge bg-warning text-dark" th:text="${#lists.size(submissions)}">0</span>
            </div>
            <div th:if="${#lists.isEmpty(submissions)}" class="text-secondary small">No submissions awaiting review.</div>
            <div class="table-responsive" th:if="${!#lists.isEmpty(submissions)}">
                <table class="table align-middle">
                    <thead>
                    <tr><th>App</th><th>Developer</th><th>Category</th><th>Submitted</th><th></th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="sub : ${submissions}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img th:if="${sub.iconUrl != null}" th:src="${sub.iconUrl}" alt="" width="42" height="42" class="rounded-3 object-fit-cover"/>
                                <div>
                                    <div class="fw-semibold" th:text="${sub.name}">Name</div>
                                    <div class="text-secondary small" th:text="${sub.subtitle}">Subtitle</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${sub.developer != null ? sub.developer : sub.submitter.fullName}">Developer</td>
                        <td th:text="${sub.category != null ? sub.category.name : 'Uncategorized'}">Category</td>
                        <td class="text-secondary small" th:text="${#temporals.format(sub.createdAt, 'MMM d, yyyy HH:mm')}">Date</td>
                        <td class="text-end">
                            <a th:href="@{/admin/submissions/{id}(id=${sub.id})}" class="btn btn-sm btn-outline-primary rounded-pill">
                                Review
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
