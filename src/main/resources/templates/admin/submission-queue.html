<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Submission Queue')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0"><i class="fa-solid fa-inbox me-2 text-primary"></i>Submission Review Queue</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary rounded-pill px-3">
            <i class="fa-solid fa-arrow-left me-1"></i>Back to Dashboard
        </a>
    </div>

    <div th:if="${#lists.isEmpty(submissions)}" class="text-center py-5 bg-white rounded-3 shadow-sm">
        <i class="fa-solid fa-check-circle fa-3x text-success mb-3"></i>
        <h4 class="text-secondary">No pending submissions</h4>
        <p class="text-muted">All submissions have been reviewed.</p>
    </div>

    <div th:unless="${#lists.isEmpty(submissions)}" class="bg-white rounded-3 shadow-sm p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>App</th>
                        <th>Developer</th>
                        <th>Submitter</th>
                        <th>Category</th>
                        <th>Submitted</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                <tr th:each="sub : ${submissions}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <img th:src="${sub.iconUrl != null ? sub.iconUrl : 'https://placehold.co/40x40/ffc107/333?text=' + (sub.name != null and sub.name.length() > 0 ? sub.name.substring(0,1) : '?')}"
                                 th:alt="${sub.name}" width="40" height="40" class="rounded-3"/>
                            <span class="fw-semibold" th:text="${sub.name}">App</span>
                        </div>
                    </td>
                    <td class="text-secondary" th:text="${sub.developer != null ? sub.developer : '-'}">Dev</td>
                    <td class="text-secondary" th:text="${sub.submitter.fullName}">Submitter</td>
                    <td class="text-secondary" th:text="${sub.category != null ? sub.category.name : '-'}">Cat</td>
                    <td class="text-secondary" th:text="${#temporals.format(sub.createdAt, 'MMM dd, yyyy')}">Date</td>
                    <td>
                        <a th:href="@{/admin/submissions/{id}(id=${sub.id})}" class="btn btn-sm btn-primary rounded-pill">
                            <i class="fa-solid fa-eye me-1"></i>Review
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
