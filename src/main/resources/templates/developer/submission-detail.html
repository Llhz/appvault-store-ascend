<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Submission Detail')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
    <div class="container py-4" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <p class="text-secondary mb-1">Submission detail</p>
                <h1 class="page-title mb-0" th:text="${submission.name}">App Name</h1>
            </div>
            <a th:href="@{/developer/dashboard}" class="btn btn-outline-secondary rounded-pill">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>

        <div class="bg-white rounded-3 shadow-sm p-4 mb-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center gap-3">
                    <img th:if="${submission.iconUrl != null}" th:src="${submission.iconUrl}" alt="" width="72" height="72" class="rounded-3 object-fit-cover"/>
                    <div>
                        <div class="fw-semibold" th:text="${submission.name}">Name</div>
                        <div class="text-secondary" th:text="${submission.subtitle}">Subtitle</div>
                    </div>
                </div>
                <span class="badge px-3 py-2"
                      th:classappend="${submission.status.name() == 'APPROVED'} ? ' bg-success' :
                                      (submission.status.name() == 'PENDING_REVIEW' ? ' bg-warning text-dark' :
                                      (submission.status.name() == 'REJECTED' ? ' bg-danger' : ' bg-secondary'))}"
                      th:text="${#strings.capitalize(submission.status.name().toLowerCase().replace('_', ' '))}">
                </span>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="text-secondary small">Developer</div>
                    <div class="fw-semibold" th:text="${submission.developer != null ? submission.developer : submission.submitter.fullName}">Developer</div>
                </div>
                <div class="col-md-3">
                    <div class="text-secondary small">Category</div>
                    <div class="fw-semibold" th:text="${submission.category != null ? submission.category.name : 'Uncategorized'}">Category</div>
                </div>
                <div class="col-md-3">
                    <div class="text-secondary small">Price</div>
                    <div class="fw-semibold" th:text="${submission.price != null and submission.price.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 'Free' : '$' + #numbers.formatDecimal(submission.price, 1, 2)}">Free</div>
                </div>
            </div>

            <div class="mb-3">
                <div class="text-secondary small">Description</div>
                <p class="mb-0" th:text="${submission.description}">Description text</p>
            </div>

            <div th:if="${submission.reviewNotes != null}" class="alert"
                 th:classappend="${submission.status.name() == 'REJECTED'} ? ' alert-danger' : ' alert-success'">
                <div class="fw-semibold mb-1">Review Notes</div>
                <div th:text="${submission.reviewNotes}">Notes</div>
            </div>

            <div class="d-flex align-items-center gap-2">
                <form th:if="${submission.status.name() == 'DRAFT' or submission.status.name() == 'REJECTED'}"
                      th:action="@{/developer/submit/{id}/review(id=${submission.id})}" method="post" class="mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-primary rounded-pill">
                        <i class="fa-solid fa-paper-plane me-2"></i>Submit for Review
                    </button>
                </form>
                <a th:if="${submission.status.name() == 'APPROVED' and submission.appListing != null}"
                   th:href="@{/app/{id}(id=${submission.appListing.id})}"
                   class="btn btn-outline-success rounded-pill">
                    <i class="fa-solid fa-arrow-up-right-from-square me-2"></i>View App Listing
                </a>
            </div>
        </div>

        <div class="bg-white rounded-3 shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="fw-semibold mb-0">Status Timeline</h5>
                <span class="badge"
                      th:classappend="${submission.status.name() == 'APPROVED'} ? ' bg-success' :
                                      (submission.status.name() == 'PENDING_REVIEW' ? ' bg-warning text-dark' :
                                      (submission.status.name() == 'REJECTED' ? ' bg-danger' : ' bg-secondary'))}"
                      th:text="${#strings.capitalize(submission.status.name().toLowerCase().replace('_', ' '))}">Status</span>
            </div>
            <p class="text-secondary small mb-0">
                Created <span th:text="${#temporals.format(submission.createdAt, 'MMM d, yyyy HH:mm')}">today</span>
                • Updated <span th:text="${#temporals.format(submission.updatedAt, 'MMM d, yyyy HH:mm')}">today</span>
            </p>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
