<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Submit App')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
<div class="container py-4" style="max-width: 800px;">
    <div class="mb-4">
        <a th:href="@{/developer/dashboard}" class="text-decoration-none text-secondary">
            <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
        </a>
    </div>

    <div class="bg-white rounded-3 shadow-sm p-4">
        <h2 class="fw-bold mb-4">Submit New App</h2>

        <form th:action="@{/developer/submit}" method="post" th:object="${submissionDto}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="row mb-3">
                <div class="col-md-8">
                    <label class="form-label fw-semibold">App Name *</label>
                    <input type="text" class="form-control rounded-3" th:field="*{name}" required maxlength="100"/>
                    <div class="text-danger small mt-1" th:errors="*{name}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Category</label>
                    <select class="form-select rounded-3" th:field="*{categoryId}">
                        <option value="">— Select Category —</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Subtitle</label>
                <input type="text" class="form-control rounded-3" th:field="*{subtitle}" maxlength="200"
                       placeholder="Short tagline for your app"/>
                <div class="text-danger small mt-1" th:errors="*{subtitle}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Description *</label>
                <textarea class="form-control rounded-3" th:field="*{description}" rows="8" required maxlength="5000"
                          placeholder="Describe your app's features, benefits, and why users will love it..."></textarea>
                <div class="form-text">Markdown supported. Max 5000 characters.</div>
                <div class="text-danger small mt-1" th:errors="*{description}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Developer Name *</label>
                    <input type="text" class="form-control rounded-3" th:field="*{developer}" required
                           placeholder="Your company or developer name"/>
                    <div class="text-danger small mt-1" th:errors="*{developer}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Price (USD)</label>
                    <input type="number" class="form-control rounded-3" th:field="*{price}" step="0.01" min="0"
                           placeholder="0.00"/>
                    <div class="form-text">0 = Free</div>
                    <div class="text-danger small mt-1" th:errors="*{price}"></div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Icon URL</label>
                <input type="url" class="form-control rounded-3" th:field="*{iconUrl}"
                       placeholder="https://example.com/icon.png"/>
                <div class="form-text">Direct URL to your app icon (200x200 recommended)</div>
                <div class="text-danger small mt-1" th:errors="*{iconUrl}"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary rounded-pill px-4">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Save as Draft
                </button>
                <a th:href="@{/developer/dashboard}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
