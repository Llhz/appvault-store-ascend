<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Submit App')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
    <div class="container py-4" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <p class="text-secondary mb-1">Create a submission</p>
                <h1 class="page-title mb-0"><i class="fa-solid fa-paper-plane me-2 text-primary"></i>Submit an App</h1>
            </div>
            <a th:href="@{/developer/dashboard}" class="btn btn-outline-secondary rounded-pill">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>

        <div class="bg-white rounded-3 shadow-sm p-4">
            <form th:action="@{/developer/submit}" th:object="${submissionDto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">App Name</label>
                        <input type="text" class="form-control rounded-3" th:field="*{name}" placeholder="Awesome App" maxlength="100" required/>
                        <div class="text-danger small mt-1" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Developer / Company</label>
                        <input type="text" class="form-control rounded-3" th:field="*{developer}" placeholder="Your studio name" maxlength="150"/>
                        <div class="text-danger small mt-1" th:errors="*{developer}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Subtitle</label>
                    <input type="text" class="form-control rounded-3" th:field="*{subtitle}" placeholder="Short tagline" maxlength="200"/>
                    <div class="text-danger small mt-1" th:errors="*{subtitle}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea class="form-control rounded-3" th:field="*{description}" rows="6" placeholder="Describe your app, features, and value" maxlength="5000" required></textarea>
                    <div class="text-danger small mt-1" th:errors="*{description}"></div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Icon URL</label>
                        <input type="url" class="form-control rounded-3" th:field="*{iconUrl}" placeholder="https://..."/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Price</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" min="0" class="form-control rounded-end-3" th:field="*{price}"/>
                        </div>
                        <div class="text-danger small mt-1" th:errors="*{price}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Category</label>
                        <select class="form-select rounded-3" th:field="*{categoryId}">
                            <option value="">Select a category</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <div class="text-secondary small">You can save as draft and submit for review later.</div>
                    <div class="d-flex gap-2">
                        <button type="submit" name="action" value="draft" class="btn btn-outline-secondary rounded-pill">
                            Save as Draft
                        </button>
                        <button type="submit" name="action" value="submit" class="btn btn-primary rounded-pill">
                            Submit for Review
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
